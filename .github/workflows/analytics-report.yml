name: Weekly analytics report

# 毎週月曜 9:00(日本時間)に先週の月曜〜日曜のアクセスを、手動実行では今日を含む直近7日間のアクセスを Discord に送る
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Send report
        run: node scripts/analytics/send.ts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 手動実行のときは、今日を含む直近7日間を送る
          REPORT_RECENT: ${{ github.event_name == 'workflow_dispatch' }}
