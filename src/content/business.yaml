    - お問い合わせは、LINE公式アカウントでお願いします。LINEをご利用でない方は、メールでも承ります。
  LINE公式アカウント: https://lin.ee/Zp3za2N
  メールアドレス: coffeehousehiro@gmail.com
  販売価格:
    - メニューに表示した価格（税込）です。
    - 時価の商品は、ご注文のときに価格をお知らせします。
  販売数量:
    - 在庫・焙煎量に限りがあります。
    - ご入金後に品切れとなった場合は、ご連絡のうえ全額を返金します。
  商品代金以外の必要料金:
    - 送料：全国一律、2アイテム分ごとに¥270です（1〜2アイテム分で¥270、3〜4アイテム分で¥540）。
