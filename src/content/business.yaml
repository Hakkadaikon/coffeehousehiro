    - ご請求は、ご注文に使われたLINEまたはメールからご連絡ください。そのアカウントが使えない場合は、メールでご相談ください。ご本人であることは、ご注文のときのお名前・ご住所・ご注文内容と照らし合わせて確認します。代理人からのご請求は、委任状を確認したうえでお受けします。
