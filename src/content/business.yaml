# お店の事業情報。ページ本文、検索エンジン向けの店舗情報(index.html の JSON-LD)、
# 特定商取引法に基づく表記とプライバシーポリシー(/legal)は、すべてこのファイルの値を使う。
# 書き換えたら npm test を実行する。項目が足りない・形が違うときはテストとビルドが失敗する。

shop:
  name: コーヒーhouseヒロ
  postalCode: 712-8046
  # 住所は「都道府県」「市区町村」「それ以降」に分けて書く。ページには続けて表示する
  region: 岡山県
  locality: 倉敷市
  street: 福田町福田2370-6
  # 店の位置(北緯・東経)。Googleマップのリンクと、検索エンジン向けの店舗情報に使う。住所で検索しても場所が出ないため
  latitude: 34.54845
  longitude: 133.75713
  email: coffeehousehiro@gmail.com
  instagram:
    handle: "@coffee_house_hiro"
    url: https://www.instagram.com/coffee_house_hiro/
  line:
    # 友だち追加のURLと、公式アカウントのID(@ を除いた部分)
    url: https://lin.ee/Zp3za2N
    accountId: 992mqixg
  payments:
    - PayPay
    - 楽天ペイ
    - 銀行振込
  # 来店予約フォームで選べる時間帯(原則)。[開始, 終わり] の時刻(時)。休日は土日・祝日
  # 営業日はInstagramで知らせるので、ここには書かない
  visit:
    weekdayHours: [18, 23]
    holidayHours: [10, 23]
    # 1組あたりの人数の上限
    maxGuests: 4

# 特定商取引法に基づく表記。/legal のページに、この順で表にして載せる。
# 値は1行で書くか、「- 」で始まる行を並べる(1行が1段落)。「- strong: 文」と書いた段落は強調して表示する。
# 「https://」で始まる段落はリンクになる。
# 販売事業者の屋号・所在地・メールアドレス・支払方法は上の shop と、送料は src/order/pricing.ts と同じ値にする。違うと npm test が失敗する。
legalNotice:
  販売事業者: 田中大之（屋号：コーヒーhouseヒロ）
  所在地:
    - 〒712-8046
    - 岡山県倉敷市福田町福田2370-6
  電話番号:
    - ご請求があった場合は、遅滞なく開示します。
    - お問い合わせは、LINE公式アカウントでお願いします。LINEをご利用でない方は、メールでも承ります。
  LINE公式アカウント: https://lin.ee/Zp3za2N
  メールアドレス: coffeehousehiro@gmail.com
  販売価格:
    - メニューに表示した価格（税込）です。
    - 価格に幅のある商品・時価の商品は、ご注文の際に価格をお知らせします。
  販売数量:
    - 在庫・焙煎量に限りがあります。
    - ご入金後に品切れとなった場合は、当店からご連絡したうえで、全額を返金します。
  商品代金以外の必要料金:
    - 送料は全国一律で、2アイテム分ごとに¥270です（1〜2アイテム分で¥270、3〜4アイテム分で¥540）。
    - コーヒー豆1袋は1アイテム、ドリップバッグ1セットは0.5アイテムと数えます。
    - 銀行振込の振込手数料は、お客様のご負担となります。
  支払方法: PayPay・楽天ペイ・銀行振込
  支払時期:
    - 前払いです。当店からお支払いのご案内をお送りしてから7日以内にお支払いください。
    - 期限を過ぎた場合は、ご注文をキャンセル扱いとします。
  申込みの有効期限: お支払いのご案内をお送りしてから7日間です。
  ご注文の確定: 当店から、お支払いのご案内（商品・合計金額・お支払い先）をお送りします。内容をご確認のうえお支払いいただいた時点で、ご注文が確定します。
  引渡時期:
    - ご入金の確認後に焙煎し、クリックポスト（日本郵便）で発送します。
    - strong: 焙煎は原則として土曜日・日曜日に行います。当店の都合により、焙煎日が変わる場合があります。
    - 発送の翌日から翌々日を目安に、郵便受けにお届けします。遠方や離島など一部の地域では、さらに数日から1週間ほどかかる場合があります。
  返品・キャンセル:
    - お届けした商品に破損・不良があった場合、またはご注文と異なる商品が届いた場合は、お手数ですが商品到着後7日以内を目安にご連絡ください。返品をお受けして返金します。返品の送料は当店が負担します。配送中の破損も同様に対応します。配送中に商品を紛失した場合は、返金します。
    - お客様のご都合によるキャンセルは、焙煎前までにご連絡いただいた場合、全額を返金します。
    - 焙煎後のキャンセルと、商品到着後のお客様のご都合による返品はお受けしていません。

# プライバシーポリシー。/legal の特定商取引法に基づく表記の下に、この順で表にして載せる。書き方は legalNotice と同じ。
# 事業者は legalNotice の販売事業者・所在地と、お問い合わせ窓口は shop と同じ値にする。違うと npm test が失敗する。
privacyPolicy:
  事業者:
    - 田中大之（屋号：コーヒーhouseヒロ）
    - 〒712-8046 岡山県倉敷市福田町福田2370-6
  取得する個人情報:
    - ご注文・ご来店のご予約・お問い合わせの際に、LINEまたはメールでお知らせいただいたお名前・ご住所・お電話番号・メールアドレス・LINEの表示名と、ご注文・ご予約の内容です。
    - ご入金の際のお名前（振込名義や決済サービス上のお名前）も取得します。
  利用目的:
    - 商品の発送
    - ご注文・お支払いに関するご連絡と、ご入金の確認
    - ご来店の予約に関するご連絡
    - お問い合わせへの返信
    - 法令に基づく取引記録の作成・保管
  第三者への提供: 個人情報は、ご本人の同意なく第三者に提供しません。ただし、法令に基づく場合など、法律で認められた場合を除きます。
  取り扱いの委託: 商品の発送のため、お名前・ご住所を日本郵便株式会社（クリックポスト）に提供します。
  安全管理:
    - 個人情報を保管するのは、ご連絡をいただいたLINE・メール、発送の手続き（クリックポスト）、ご入金の記録（PayPay・楽天ペイ・銀行口座）の中だけです。紙やほかのアプリなど、これら以外の場所に書き写して保管しません。
    - メールは、Google LLC（米国）のGmailで受け取っています。メールのデータは、米国を含む複数の国のサーバーに保管されることがあります。当店は、米国の個人情報保護制度を把握したうえで、メールを管理しています。
    - LINEでのやりとりには、LINEヤフー株式会社（日本）のLINE公式アカウントを使っています。
  保管期間: 取引の記録は、法令で定められた期間保管します。それ以外の個人情報は、利用目的を達成し、不要になった時点で削除します。
  開示・訂正・削除・利用停止のご請求:
    - ご本人から、当店が保有している個人情報の開示・訂正・削除・利用停止のご請求があった場合は、ご本人であることを確認したうえで遅滞なく対応します。ただし、法令に基づき保管が必要な取引の記録は、保管期間が過ぎるまで削除できません。
    - ご請求は、ご注文の際にお使いいただいたLINEまたはメールからお送りください。そのアカウントが使えない場合は、メールでご相談ください。本人確認は、ご注文の際のお名前・ご住所・ご注文内容との照合により行います。代理人からのご請求は、委任状を確認したうえでお受けします。
    - 手数料はいただきません。
  お問い合わせ窓口:
    - 個人情報の取り扱いに関するご質問やご意見は、LINE公式アカウントへお寄せください。LINEをご利用でない方は、メールでも承ります。
    - https://lin.ee/Zp3za2N
    - coffeehousehiro@gmail.com
