  ご注文の確定: 当店からのお支払いのご案内（商品・合計金額・お支払い先）をご確認のうえ、お支払いいただいた時点でご注文が確定します。
  引渡時期:
    - ご入金を確認した後に焙煎し、クリックポスト（日本郵便）で発送します。
    - strong: 焙煎は原則として土曜日・日曜日に行います。当店の都合により、焙煎日が変わる場合があります。
    - 発送の翌日から翌々日を目安に、郵便受けにお届けします。遠方や離島など一部の地域では、さらに数日から1週間ほどかかる場合があります。
  返品・キャンセル:
    - お届けした商品に破損・不良があった場合、またはご注文と異なる商品が届いた場合は、お手数ですが商品到着後7日以内を目安にご連絡ください。返品・返金をお受けし、返品の送料は当店が負担します。配送中の破損・紛失も同様に対応します。
    - お客様のご都合によるキャンセルは、焙煎の前までにご連絡いただければ、全額を返金します。
    - 焙煎後のキャンセルと、商品到着後のお客様のご都合による返品はお受けしていません。

