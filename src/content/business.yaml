  販売事業者: 田中大之（屋号：コーヒーhouseヒロ）
  所在地:
    - 〒712-8046
    - 岡山県倉敷市福田町福田2370-6
  電話番号:
    - ご請求があれば遅滞なく開示します。
    - お問い合わせは、メールまたはLINEでお願いします。
  メールアドレス: coffeehousehiro@gmail.com
  販売価格:
    - メニューに表示した価格（税込）です。
    - 時価の商品は、ご注文のときに価格をお知らせします。
  販売数量:
    - 在庫・焙煎量に限りがあります。
    - ご入金後に品切れとなった場合は、ご連絡のうえ全額を返金します。
  商品代金以外の必要料金:
    - 送料：全国一律、2アイテム分ごとに¥270（1〜2アイテム分で¥270、3〜4アイテム分で¥540。コーヒー豆1袋は1アイテム、ドリップバッグ1セットは0.5アイテムと数えます）
    - 銀行振込の振込手数料は、お客様のご負担となります。
  支払方法: PayPay・楽天ペイ・銀行振込
  支払時期:
    - 前払いです。当店からお支払いのご案内をお送りしてから7日以内に、お支払いください。
    - 期限を過ぎた場合は、ご注文をキャンセルとさせていただきます。
  申込みの有効期限: お支払いのご案内をお送りしてから7日間です。
  ご注文の確定: 当店からのお支払いのご案内（商品・合計金額・お支払い先）をご確認のうえ、お支払いいただいた時点でご注文が確定します。
  引渡時期:
    - ご入金を確認した後に焙煎し、クリックポスト（日本郵便）で発送します。
    - 焙煎は原則として土曜日・日曜日に行います。当店の都合により、焙煎日が変わる場合があります。
    - 発送の翌日から翌々日を目安に、郵便受けにお届けします。遠方や離島など一部の地域では、さらに数日から1週間ほどかかる場合があります。
  返品・キャンセル:
    - お届けした商品に破損・不良があった場合、またはご注文と異なる商品が届いた場合は、お手数ですが商品到着後7日以内を目安にご連絡ください。返品・返金をお受けします（返品の送料は当店が負担します）。配送中の破損・紛失も同様に対応します。
    - お客様のご都合によるキャンセルは、焙煎前までにご連絡いただければ、全額を返金します。
    - 焙煎後のキャンセルと、商品到着後のお客様のご都合による返品はお受けしていません。
