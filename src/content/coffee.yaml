# コーヒーの知識。商品一覧の下の「焙煎度で変わる味」(焙煎度スライダー)は、このファイルの値を使う。
# 書き換えたら npm test を実行する。項目が足りない・形が違うときはテストとビルドが失敗する。

# 焙煎度。浅い順に並べ、スライダーの左から右へこの順で置く。
# name は、注文フォームで選べる焙煎度(src/content/menu.ts の ROASTS、「おまかせ」を除く)と同じ名前・同じ順にする。違うと npm test が失敗する。
# color は豆の絵の色(#RRGGBB)。スライダーの位置に合わせて、隣の焙煎度の色へ少しずつ変わる。
# taste は酸味(acidity)・苦味(bitterness)・コク(body)の強さで、1〜5の数で書く。
roastLevels:
  - name: 浅煎り
    color: "#B5804C"
    about: 酸味がはっきりしていて、すっきりと軽い口当たりです。産地ごとの個性がいちばん出やすい焙煎度です。
    aroma: 豆によっては、柑橘や花、ベリーのような明るい香り
    drink: ブラックで。少し冷めてから飲むと、甘みと酸味がよく分かります。
    taste: { acidity: 5, bitterness: 1, body: 2 }
  - name: 中煎り
    color: "#7B4A28"
    about: 酸味と苦味のバランスがよく、甘みを感じやすい焙煎度です。毎日飲んでも飽きにくい味です。
    aroma: ナッツやキャラメルのような甘い香り
    drink: ブラックでも、少しミルクを入れても合います。
    taste: { acidity: 3, bitterness: 3, body: 3 }
  - name: 中深煎り
    color: "#4A2B19"
    about: 苦味とコクがしっかりしていて、酸味は控えめです。
    aroma: チョコレートやローストしたナッツのような香ばしい香り
    drink: カフェオレや、甘いお菓子と一緒に。
    taste: { acidity: 2, bitterness: 4, body: 4 }
